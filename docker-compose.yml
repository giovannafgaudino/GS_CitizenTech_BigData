# Airflow 2.9 (LocalExecutor) + Postgres de metadados + Postgres do Data Warehouse.
#   cp .env.example .env && docker compose up airflow-init && docker compose up -d
#   Airflow UI: http://localhost:8080  (admin / admin)   |   DW: localhost:5433  (dw / dw, db cidadeviva_dw)
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: cidadeviva-gs-2026-chave-fixa
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    _PIP_ADDITIONAL_REQUIREMENTS: "pyarrow psycopg2-binary"
    PIPELINE_ROOT: /opt/airflow/project
    DATA_DIR: /opt/airflow/project/data
    WAREHOUSE_URL: postgresql+psycopg2://dw:dw@warehouse:5432/cidadeviva_dw
    SP156_MODE: ${SP156_MODE:-real}
    SP156_FONTE: ${SP156_FONTE:-auto}
    SP156_LOCAL_PATH: ${SP156_LOCAL_PATH:-}
    HASH_SALT: ${HASH_SALT:-cidadeviva-dev-salt}
    CIDADEVIVA_API_URL: ${CIDADEVIVA_API_URL:-}
    CIDADEVIVA_API_KEY: ${CIDADEVIVA_API_KEY:-}
    PYTHONPATH: /opt/airflow/project
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./:/opt/airflow/project
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-db: {condition: service_healthy}
    warehouse: {condition: service_healthy}

services:
  airflow-db:
    image: postgres:15
    environment: {POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow}
    healthcheck: {test: ["CMD", "pg_isready", "-U", "airflow"], interval: 5s, retries: 10}
    volumes: [airflow-db:/var/lib/postgresql/data]

  warehouse:
    image: postgres:15
    environment: {POSTGRES_USER: dw, POSTGRES_PASSWORD: dw, POSTGRES_DB: cidadeviva_dw}
    ports: ["5433:5432"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "dw", "-d", "cidadeviva_dw"], interval: 5s, retries: 10}
    volumes: [warehouse:/var/lib/postgresql/data]

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname CV --role Admin --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    healthcheck: {test: ["CMD", "curl", "--fail", "http://localhost:8080/health"], interval: 15s, retries: 10}

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

volumes:
  airflow-db:
  warehouse: